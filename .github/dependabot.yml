# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    reviewers:
      - "yutotnh"
    ignore:
      # Keep @types/node aligned with VS Code's Node.js major (see .nvmrc).
      # Allow patch/minor updates within the major, but ignore major bumps so
      # the type definitions don't drift ahead of the runtime Node.js version.
      # Bump this rule when .nvmrc moves to a new Node.js major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # Keep @types/vscode pinned to engines.vscode in package.json. vsce refuses
      # to package the extension when @types/vscode is newer than engines.vscode,
      # and letting the types drift ahead would also let us use APIs that do not
      # exist in the oldest supported VS Code. Bump this together with
      # engines.vscode, never on its own.
      - dependency-name: "@types/vscode"

      # Mocha runs inside the VS Code extension host, so it is bound by the
      # Node.js version of the OLDEST supported VS Code (1.66 ships Node 14),
      # not by .nvmrc. Mocha 11 requires Node 18 or newer, so stay on 10.x until
      # engines.vscode moves past the VS Code releases that bundle Node 14.
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 (the native/Go "tsgo" rewrite) is not yet supported by
      # the rest of the toolchain: @typescript-eslint's peer dependency caps
      # typescript at <6.1.0 (no compatible release exists, even canary), and
      # ts-loader crashes calling the native compiler's host APIs. Stay on
      # 6.x until @typescript-eslint and ts-loader ship majors that support
      # TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    reviewers:
      - "yutotnh"
