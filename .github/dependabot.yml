version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "yutotnh"
    ignore:
      # @types/nodeは実行時のExtension Host(src/test/runTest.ts以外の拡張機能本体が
      # 動く場所。engines.vscode: "^1.66.0"がバンドルするElectron 17.2.0のNode.js、
      # 現状v16.13.0)ではなく.nvmrc(microsoft/vscode自身の開発用Node.js。
      # src/test/runTest.tsもこちらで動く)に追従させる。
      # 過去に@types/node自体をExtension Hostのfloor(16.x)へ固定しようとしたが、
      # それぞれ単独でも致命的な2つの独立した問題にぶつかった
      # (実際に@types/node@16.18.126を入れてtscを実行して確認済み):
      #   1. runTest.tsが使うNode 18.3+のnode:util.parseArgsの型が無くTS2305
      #      (parseArgsをやめれば解消するのはこの1つだけ)
      #   2. @types/node@16.x自身のhttps.d.tsが現在のTypeScriptとTS2320で衝突
      #      (skipLibCheckでしか回避できず、そこは妥協したくない。(1)を直しても
      #      解消しない。TypeScriptを下げて回避しようとしても(5.3.3で確認)、
      #      今度は@vscode/test-electron側の型がTS2315で衝突するだけ)
      # 実行時floorとのずれはeslint.config.jsのeslint-plugin-n
      # (n/no-unsupported-features/*、src/**/*.tsは>=16.13.0、runTest.tsのみ
      # >=18.3.0)が検知するため、@types/nodeは安全に.nvmrcへ追従できる。
      # ただしこのガードはグローバル参照とモジュールメンバのみが対象で、
      # プロトタイプメソッド(Array#at等)はtsconfig.jsonの"lib": ["ES2021"]が
      # 別途担保している。
      # メジャーのみignoreする(パッチ/マイナーは追従させ、ルールが陳腐化しないように
      # する)。.nvmrcのメジャーを上げる際はこのルールとeslint-plugin-nのバージョン
      # 範囲も見直す。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # @types/vscodeはpackage.jsonのengines.vscodeに固定する。vsceはengines.vscode
      # より新しい@types/vscodeでのパッケージングを拒否するし、型だけ先行させると
      # 未対応の古いVS Codeに存在しないAPIを使ってしまいかねない。engines.vscodeを
      # 上げる時だけ一緒に上げる。
      - dependency-name: "@types/vscode"

      # NOTE: mochaは意図的にignoreしていない。mochaはExtension Host内で動くため
      # Node.jsのfloorは.nvmrcでなく最古対応VS Code(1.66.0がバンドルするElectron
      # 17.2.0のNode.js v16.13.0)基準だが、mocha 11(#674)のengines.nodeは>=18.18で
      # これを満たさない。ただしmochaはdist/に含まれないdevDependencyで、engines
      # はインストール時の警告に過ぎない。ignoreはセキュリティ更新PRも止めてしまう
      # ため、その代償の方が大きいと判断した。実行時の担保は
      # `test-minimum-vscode-version` CI(1.66.0/1.100.0、3OS)。ここが赤くなったら
      # 見直す。

      # TypeScript 7(ネイティブ実装の"tsgo")は@typescript-eslintの対応バージョン
      # 上限(<6.1.0、canaryにも互換版が無い)を超えており、ts-loaderもネイティブ
      # コンパイラのホストAPI呼び出しでクラッシュするため、6.x系に留める。
      # 両者がTypeScript 7対応のメジャーを出したら外す。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "yutotnh"
