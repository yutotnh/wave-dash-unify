name: "Test & Publish"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  test-and-publish:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - name: Publish
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        run: npm run vscode:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Check Open VSX secret
        id: check_ovsx_pat
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        # if では secrets を参照できないため、後続ステップの if から参照できる
        # 真偽値(secretの値そのものではない)だけを output として渡す。
        # これによりOVSX_PAT自体はこのステップ以降どこにも露出しない
        run: echo "has_pat=${{ secrets.OVSX_PAT != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to Open VSX
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && steps.check_ovsx_pat.outputs.has_pat == 'true'
        run: npm run vscode:publish-ovsx
        env:
          # このステップの実行時にだけ見えるスコープに閉じる(job全体には出さない)
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # Open VSXへの公開が失敗しても、既存のVS Code Marketplaceへの公開・
        # GitHub Releaseの作成(Create package/Release)は継続させる。
        # これらは元々独立した公開先であり、片方の失敗でもう片方まで
        # ブロックされるのは意図しない結合のため
        continue-on-error: true
      - name: Create package
        run: npm run vscode:package
      - name: Release
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: wave-dash-unify-*.vsix

  test-minimum-vscode-version:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      - run: xvfb-run -a npm test -- --vscode-version 1.100.0
        if: runner.os == 'Linux'
      - run: npm test -- --vscode-version 1.100.0
        if: runner.os != 'Linux'
