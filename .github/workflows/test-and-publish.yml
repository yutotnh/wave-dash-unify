name: "Test & Publish"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  test-and-publish:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - name: Create package
        run: npm run vscode:package

  # Publishing is its own job so that only it runs in the release environment
  # (v* tags only, holds AZURE_CLIENT_ID / AZURE_TENANT_ID); putting the
  # environment on the matrix job above would block main and PR runs.
  publish:
    needs: test-and-publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # for azure/login (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      # No PAT: Azure DevOps retires global PATs on 2026-12-01, so vsce signs
      # in as a managed identity (a member of the publisher) through OIDC.
      - name: Sign in to Microsoft Entra ID (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish
        run: npm run vscode:publish -- --azure-credential
      - name: Publish to Open VSX
        run: npm run vscode:publish-ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true
      - name: Create package
        run: npm run vscode:package
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: wave-dash-unify-*.vsix

  # Exercise both EUC-JP detection paths (see src/eucjp.ts):
  # 1.66.0 is engines.vscode, where TextDocument.encoding does not exist yet and
  # detection falls back to scanning the file's bytes; 1.100.0 is the first
  # release with TextDocument.encoding, which the API path relies on.
  test-minimum-vscode-version:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        vscode-version: ["1.66.0", "1.100.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      - run: xvfb-run -a npm test -- --vscode-version ${{ matrix.vscode-version }}
        if: runner.os == 'Linux'
      - run: npm test -- --vscode-version ${{ matrix.vscode-version }}
        if: runner.os != 'Linux'
        shell: bash
