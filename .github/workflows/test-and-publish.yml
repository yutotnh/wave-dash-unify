name: "Test & Publish"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
  release:
    # createdはdraft releaseの作成時にも発火し、その後draftを公開してもpublishedしか
    # 発火しないため、公開の瞬間を必ず拾えるpublishedを使う
    types:
      - published

permissions:
  contents: write

jobs:
  test-and-publish:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - name: Publish
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        run: npm run vscode:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        run: npm run vscode:publish-ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true
      - name: Create package
        run: npm run vscode:package
      - name: Release
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: wave-dash-unify-*.vsix

  # Exercise both EUC-JP detection paths (see src/eucjp.ts):
  # 1.66.0 is engines.vscode, where TextDocument.encoding does not exist yet and
  # detection falls back to scanning the file's bytes; 1.100.0 is the first
  # release with TextDocument.encoding, which the API path relies on.
  test-minimum-vscode-version:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        vscode-version: ["1.66.0", "1.100.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      - run: xvfb-run -a npm test -- --vscode-version ${{ matrix.vscode-version }}
        if: runner.os == 'Linux'
      - run: npm test -- --vscode-version ${{ matrix.vscode-version }}
        if: runner.os != 'Linux'
        shell: bash
